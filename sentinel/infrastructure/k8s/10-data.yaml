apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel-postgres
  namespace: sentinel
spec:
  serviceName: sentinel-postgres
  replicas: 1
  selector: { matchLabels: { app: sentinel-postgres } }
  template:
    metadata:
      labels: { app: sentinel-postgres }
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          ports: [{ containerPort: 5432 }]
          envFrom:
            - configMapRef: { name: sentinel-config }
            - secretRef: { name: sentinel-secrets }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "4", memory: 8Gi }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "sentinel"] }
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 200Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: sentinel-postgres, namespace: sentinel }
spec:
  selector: { app: sentinel-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sentinel-redis, namespace: sentinel }
spec:
  replicas: 1
  selector: { matchLabels: { app: sentinel-redis } }
  template:
    metadata: { labels: { app: sentinel-redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # A transport, not a store of record. Everything durable is in
          # PostgreSQL, so persistence here would only add IO.
          args: ["redis-server", "--save", "", "--appendonly", "no",
                 "--maxmemory", "4gb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits:   { cpu: "2",  memory: 5Gi }
---
apiVersion: v1
kind: Service
metadata: { name: sentinel-redis, namespace: sentinel }
spec:
  selector: { app: sentinel-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
