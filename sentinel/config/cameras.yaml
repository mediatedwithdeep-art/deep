# ─────────────────────────────────────────────────────────────────────────
# REAL CAMERA CONFIGURATION
#
# This is the ONLY file you edit to connect Sentinel to live cameras.
# No source changes. No rebuild. Restart the ingestion service and the
# cameras below are pulled alongside (or instead of) the demo estate.
#
#   1. Set INGEST_MODE=live   in .env   (or `hybrid` to keep the demo too)
#   2. Add your cameras below
#   3. docker compose restart ingestion
#
# CREDENTIALS
# Never write a password into stream_url in production -- the loader
# refuses to start if you do. Instead give each camera a credential_ref
# and put the value in the environment:
#
#     credential_ref: env:SENTINEL_CAM_AHM014
#     # then in .env:  SENTINEL_CAM_AHM014=viewer:the-real-password
#
# Supported refs:  env:VAR   file:/run/secrets/name   vault://path/name
# ─────────────────────────────────────────────────────────────────────────

defaults:
  protocol: RTSP
  role: SURVEILLANCE
  fov_deg: 90
  range_m: 60
  width: 1280
  height: 720
  fps: 12
  department: GP_AHM
  enabled: true

cameras: []

# ── Examples. Uncomment and edit. ───────────────────────────────────────
#
# - camera_id: AHM-SAT-101                 # your own stable identifier
#   name: Jodhpur Cross Roads - NE approach
#   latitude: 23.02705
#   longitude: 72.51192
#   heading_deg: 47                        # WHICH WAY IT LOOKS. Capture this
#   fov_deg: 82                            # during survey -- without it the
#   range_m: 65                            # map has no field of view and the
#   protocol: RTSP                         # cross-camera gate is much weaker.
#   stream_url: rtsp://10.42.7.14:554/Streaming/Channels/101
#   substream_url: rtsp://10.42.7.14:554/Streaming/Channels/102
#   credential_ref: env:SENTINEL_CAM_AHM101
#   anpr_capable: false
#   zone: Satellite
#   tags: [junction, arterial]
