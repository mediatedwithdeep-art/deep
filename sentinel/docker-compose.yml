# Sentinel MVP — single-host stack for the 50-camera prototype.
#
# `docker compose up -d` gives you: PostGIS+Timescale+pgvector, Redpanda
# (Kafka API), Redis, MinIO, MediaMTX (WebRTC), OSRM (travel times) and the
# API. The CV pipeline needs a GPU and runs via the `gpu` profile.
#
# This is a DEMO topology. Production splits edge from core (docs/01 §0) and
# every credential below moves to Vault.

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:

  # ── Data plane ───────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb-ha:pg16-all      # bundles PostGIS + pgvector
    container_name: sentinel-pg
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *logging

  redpanda:
    image: redpandadata/redpanda:v24.2.8
    container_name: sentinel-kafka
    command:
      - redpanda start
      - --overprovisioned
      - --smp 2
      - --memory 2G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports: ["9092:9092", "9644:9644"]
    volumes: [rpdata:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      retries: 20
    <<: *logging

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    command: redis-server --save "" --appendonly no --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    <<: *logging

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: sentinel-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-sentinel}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    <<: *logging

  # ── Media plane ──────────────────────────────────────────────────────
  # MediaMTX pulls each camera ONLY while someone is watching (runOnDemand),
  # which is the federated model from docs/01 §0 in miniature.
  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    container_name: sentinel-media
    network_mode: host          # WebRTC/ICE needs real host ports
    environment:
      MTX_PROTOCOLS: tcp
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    <<: *logging

  # ── Routing: road-network travel times for the spatio-temporal gate ──
  # Run scripts/prepare_osrm.sh first to build the Gujarat graph.
  osrm:
    image: osrm/osrm-backend:v5.27.1
    container_name: sentinel-osrm
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/gujarat-latest.osrm
    ports: ["5001:5000"]
    volumes: [./data/osrm:/data]
    <<: *logging

  # ── Application ──────────────────────────────────────────────────────
  api:
    build: ./services/api
    container_name: sentinel-api
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel:${PG_PASSWORD}@postgres:5432/sentinel
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      OSRM_URL: http://osrm:5000
      MEDIAMTX_URL: http://host.docker.internal:9997
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-sentinel}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_started }
    extra_hosts: ["host.docker.internal:host-gateway"]
    <<: *logging

  matcher:
    build: ./services/matcher
    container_name: sentinel-matcher
    environment:
      DATABASE_URL: postgresql://sentinel:${PG_PASSWORD}@postgres:5432/sentinel
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_started }
    <<: *logging

  # ── CV pipeline (GPU) ────────────────────────────────────────────────
  # docker compose --profile gpu up -d
  cv:
    build: ./services/cv
    container_name: sentinel-cv
    profiles: ["gpu"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://sentinel:${PG_PASSWORD}@postgres:5432/sentinel
      TARGET_FPS: "10"                 # sample down; 3x cheaper, loses nothing
      DETECTOR: "yolox_s"              # Apache-2.0; see docs/02 licence table
      REID_MODEL: "osnet_ain_x1_0"
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    depends_on:
      redpanda: { condition: service_started }
    <<: *logging

  web:
    build: ./web
    container_name: sentinel-web
    ports: ["5173:80"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
    <<: *logging

  # ── Observability ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sentinel-prom
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes: [./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    <<: *logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sentinel-grafana
    profiles: ["observability"]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    <<: *logging

volumes:
  pgdata:
  rpdata:
  miniodata:
